# Equivalente a los binds de kitty.conf

# --- alt+1..9 = goto_tab ---
set -g base-index 1
set -g renumber-windows on
# tambien en copy-mode: ahi alt+N es "repetir N veces" (el prompt count:) y le gana al bind global
run 'for i in 1 2 3 4 5 6 7 8 9; do tmux bind -n M-$i select-window -t $i \; bind -T copy-mode M-$i select-window -t $i; done'
bind -n M-t new-window      # kitty: ctrl+shift+t

# --- splits: alt+s al lado, alt+shift+s abajo (en la misma carpeta); alt+flechas para moverse ---
bind -n M-s split-window -h -c "#{pane_current_path}"
bind -n M-S split-window -v -c "#{pane_current_path}"
bind -n M-Left  select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up    select-pane -U
bind -n M-Down  select-pane -D
# en copy-mode alt+arriba/abajo es media pagina y le gana al bind global
bind -T copy-mode M-Up   select-pane -U
bind -T copy-mode M-Down select-pane -D
# alt+shift+flechas: mover el borde del split de a 5 celdas
bind -n M-S-Left  resize-pane -L 5
bind -n M-S-Right resize-pane -R 5
bind -n M-S-Up    resize-pane -U 2
bind -n M-S-Down  resize-pane -D 2

# --- comportamiento ---
set -g mouse on
set -g history-limit 50000  # lineas por pane; solo aplica a panes nuevos
# como kitty: al subir en el historial la salida sigue llegando en vivo (tmux >= 3.8)
set-hook -g pane-mode-changed 'if -F "#{==:#{pane_mode},copy-mode}" "send -X refresh-on"'
set -sg escape-time 10      # sin retardo del ESC en nvim
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"

# --- barra solo cuando hay mas de una tab ---
set -g status off
set -g status-position top
set-hook -g window-linked   'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'

set -g status-style "bg=default,fg=#808080"
set -g status-left ""
set -g status-right ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#808080"
set -g window-status-current-style "fg=#1e1e1e,bg=#ffffff,bold"
set -g destroy-unattached on
