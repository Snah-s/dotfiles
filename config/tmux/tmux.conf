# Equivalente a los binds de kitty.conf

# --- alt+1..9 = goto_tab ---
set -g base-index 1
set -g renumber-windows on
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9
bind -n M-t new-window      # kitty: ctrl+shift+t

# --- comportamiento ---
set -g mouse on
set -g history-limit 1000   # kitty: scrollback_lines
set -sg escape-time 10      # sin retardo del ESC en nvim
set -g default-terminal "tmux-256color"
set -as terminal-features ",foot*:RGB"

# --- barra solo cuando hay mas de una tab ---
set -g status off
set -g status-position top
set-hook -g window-linked   'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'
set-hook -g window-unlinked 'if -F "#{>:#{session_windows},1}" "set status on" "set status off"'

set -g status-style "bg=default,fg=#808080"
set -g status-left ""
set -g status-right ""
set -g window-status-format " #I #W "
set -g window-status-current-format " #I #W "
set -g window-status-style "fg=#808080"
set -g window-status-current-style "fg=#1e1e1e,bg=#ffffff,bold"
set -g destroy-unattached on
