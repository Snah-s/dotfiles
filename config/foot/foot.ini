[main]
font=JetBrainsMono Nerd Font:size=13
pad=5x5
shell=zsh

[cursor]
style=beam
blink=yes

[colors-dark]
alpha=0.97

foreground=d4d4d4
background=1e1e1e

selection-foreground=1e1e1e
selection-background=d7ba7d

# Kitty ANSI palette
regular0=000000
regular1=cc0403
regular2=19cb00
regular3=cecb00
regular4=0d73cc
regular5=cb1ed1
regular6=0dcdcd
regular7=dddddd

bright0=767676
bright1=f2201f
bright2=23fd00
bright3=fffd00
bright4=1a8fff
bright5=fd28ff
bright6=14ffff
bright7=ffffff

[scrollback]
lines=1000

[mouse]
hide-when-typing=yes

[url]
launch=xdg-open ${url}
